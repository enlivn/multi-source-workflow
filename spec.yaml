id: multi_source_workflow
requirements:
  - name: ecoscope-platform
    version: 2.23.0
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: pydeck
    version: 0.9.2
    channel: conda-forge
rjsf-overrides:
  properties:
    Patrols.properties.patrol_data.properties.patrol_types.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: patrol_type
          depends_on: properties.Patrols.properties.patrol_source.properties.data_source.properties.name
    Patrols.properties.patrol_data.properties.patrol_types.title: Patrol Types
    Patrols.properties.patrol_data.properties.patrol_types.description: Select patrol types to map. Leave empty to analyze all patrol types.
    Events.properties.event_data.properties.event_types.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: event_type
          depends_on: properties.Events.properties.event_source.properties.data_source.properties.name
    Events.properties.event_data.properties.event_types.title: Event Types
    Events.properties.event_data.properties.event_types.description: Select event types to map. Leave empty to analyze all event types.
task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped
workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details
  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: '%d %b %Y %H:%M:%S'
  - title: Patrols
    type: task-group
    description: Choose a data source and patrol types for the patrol track map.
    tasks:
      - name: Patrol Data Source
        id: patrol_source
        task: set_er_connection
      - name: null
        id: patrol_data
        task: get_patrol_observations
        partial:
          client: ${{ workflow.patrol_source.return }}
          time_range: ${{ workflow.time_range.return }}
          status: [done]
          include_patrol_details: true
          raise_on_empty: false
          sub_page_size: 100
          patrols_overlap_daterange: true
  - title: Events
    type: task-group
    description: Choose a data source and event types for the event point map. This source can differ from the patrol source.
    tasks:
      - name: Event Data Source
        id: event_source
        task: set_er_connection
      - name: null
        id: event_data
        task: get_events
        partial:
          client: ${{ workflow.event_source.return }}
          time_range: ${{ workflow.time_range.return }}
          event_columns: [id, time, event_type, serial_number, geometry]
          event_states: null
          force_point_geometry: true
          include_null_geometry: false
          raise_on_empty: false
          include_details: false
          include_updates: false
          include_related_events: false
          include_display_values: false
  - name: Prepare Patrol Locations
    id: patrol_relocations
    task: process_relocations
    partial:
      observations: ${{ workflow.patrol_data.return }}
      relocs_columns:
        - patrol_id
        - patrol_start_time
        - patrol_end_time
        - patrol_type__value
        - patrol_type__display
        - patrol_serial_number
        - patrol_status
        - patrol_subject
        - groupby_col
        - fixtime
        - junk_status
        - extra__source
        - geometry
      filter_point_coords:
        - {x: 180, y: 90}
        - {x: 0, y: 0}
        - {x: 1, y: 1}
  - name: Create Patrol Tracks
    id: patrol_tracks
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.patrol_relocations.return }}
      trajectory_segment_filter: null
  - name: Keep Point Events
    id: event_points
    task: filter_by_geometry_type
    partial:
      df: ${{ workflow.event_data.return }}
      geometry_types: [Point]
  - name: Map Base Layer
    id: base_maps
    task: set_base_maps
    partial:
      base_maps:
        - layer_name: OpenStreetMap
  - name: Patrol Track Layer
    id: patrol_layer
    task: create_path_layer
    partial:
      geodataframe: ${{ workflow.patrol_tracks.return }}
      data_url: null
      layer_style:
        get_color: [0, 92, 196]
        get_width: 3
        width_units: pixels
      legend: null
      zoom: true
      tooltip_columns: [extra__patrol_serial_number, extra__patrol_type__display]
  - name: Event Point Layer
    id: event_layer
    task: create_scatterplot_layer
    partial:
      geodataframe: ${{ workflow.event_points.return }}
      data_url: null
      layer_style:
        get_fill_color: [210, 105, 30]
        get_radius: 5
        radius_units: pixels
      legend: null
      zoom: true
      tooltip_columns: [serial_number, event_type, time]
  - name: Draw Patrol Map
    id: patrol_map
    task: draw_map
    partial:
      geo_layers: ${{ workflow.patrol_layer.return }}
      tile_layers: ${{ workflow.base_maps.return }}
      output_type: json
      static: false
      title: null
      legend_style: null
      max_zoom: 20
      view_state: null
      widget_id: Patrols Map
  - name: Draw Event Map
    id: event_map
    task: draw_map
    partial:
      geo_layers: ${{ workflow.event_layer.return }}
      tile_layers: ${{ workflow.base_maps.return }}
      output_type: json
      static: false
      title: null
      legend_style: null
      max_zoom: 20
      view_state: null
      widget_id: Events Map
  - name: Patrol Map Widget
    id: patrol_widget
    task: create_map_v2_widget_single_view
    skipif:
      conditions: [never]
    partial:
      title: Patrols Map
      data: ${{ workflow.patrol_map.return }}
      view: null
  - name: Event Map Widget
    id: event_widget
    task: create_map_v2_widget_single_view
    skipif:
      conditions: [never]
    partial:
      title: Events Map
      data: ${{ workflow.event_map.return }}
      view: null
  - name: Two-Source Dashboard
    id: dashboard
    task: gather_dashboard
    skipif:
      conditions: [never]
    partial:
      details: ${{ workflow.workflow_details.return }}
      time_range: ${{ workflow.time_range.return }}
      widgets:
        - ${{ workflow.patrol_widget.return }}
        - ${{ workflow.event_widget.return }}
      groupers: null
