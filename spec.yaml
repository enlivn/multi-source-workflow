id: multi_source_workflow
requirements:
- name: ecoscope-platform
  version: 2.23.0
  channel: https://repo.prefix.dev/ecoscope-workflows/
- name: pydeck
  version: 0.9.2
  channel: conda-forge
rjsf-overrides:
  properties:
    event_types.properties.event_types.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: event_type
        depends_on: properties.event_source.properties.data_source.properties.name
    event_groupers.properties.groupers.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: spatial_feature_group
        depends_on: properties.event_source.properties.data_source.properties.name
    patrol_types.properties.patrol_types.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: patrol_type
        depends_on: properties.patrol_source.properties.data_source.properties.name
    patrol_groupers.properties.groupers.ecoscope:transform:
    - transformer: EarthRangerEnumResolver
      transformer_kws:
        type: spatial_feature_group
        depends_on: properties.patrol_source.properties.data_source.properties.name
  uiSchema:
    event_groupers.groupers.items.anyOf:
    - ui:options:
        label: false
    - ui:options:
        label: false
    - ui:options:
        label: false
    event_types.event_types.ui:options.displayLabel: false
    patrol_groupers.groupers.items.anyOf:
    - ui:options:
        label: false
    - ui:options:
        label: false
    - ui:options:
        label: false
    patrol_types.patrol_types.ui:options.displayLabel: false
task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
workflow:
- name: Workflow Details
  id: workflow_details
  task: set_workflow_details
- id: base_maps
  task: set_base_maps
  partial:
    base_maps:
    - layer_name: OpenStreetMap
- name: Events — Data Source
  id: event_source
  task: set_er_connection
- name: Events — Time Range
  id: event_time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'
- name: Events — Event Types
  id: event_types
  task: get_events
  partial:
    client: ${{ workflow.event_source.return }}
    time_range: ${{ workflow.event_time_range.return }}
    event_columns:
    - id
    - time
    - event_type
    - event_category
    - reported_by
    - serial_number
    - geometry
    raise_on_empty: false
    include_details: false
    include_updates: false
    include_related_events: false
    include_display_values: true
- name: Events — Group Data
  id: event_groupers
  task: set_groupers
- name: Extract Timezone Selection
  id: events_get_timezone
  task: get_timezone_from_time_range
  partial:
    time_range: ${{ workflow.event_time_range.return }}
- name: Convert to timezone
  id: events_convert_to_user_timezone
  task: convert_values_to_timezone
  partial:
    df: ${{ workflow.event_types.return }}
    timezone: ${{ workflow.events_get_timezone.return }}
    columns:
    - time
- name: Extract reported_by_name from Events
  id: events_extract_reported_by
  task: extract_value_from_json_column
  partial:
    df: ${{ workflow.events_convert_to_user_timezone.return }}
    column_name: reported_by
    field_name_options:
    - name
    output_type: str
    output_column_name: reported_by_name
    fan_out: false
- task: extract_spatial_grouper_feature_group_names
  id: events_spatial_group_ids
  partial:
    groupers: ${{ workflow.event_groupers.return }}
- task: get_spatial_features_group
  id: event_spatial_features
  partial:
    client: ${{ workflow.event_source.return }}
  map:
    argnames: spatial_features_group_name
    argvalues: ${{ workflow.events_spatial_group_ids.return }}
- task: resolve_spatial_feature_groups_for_spatial_groupers
  id: events_resolved_groupers
  skipif:
    conditions:
    - never
  partial:
    groupers: ${{ workflow.event_groupers.return }}
    spatial_feature_groups: ${{ workflow.event_spatial_features.return }}
- name: Event Location Filter
  id: events_filter_events
  task: apply_reloc_coord_filter
  partial:
    df: ${{ workflow.events_extract_reported_by.return }}
    roi_gdf: null
    roi_name: null
    reset_index: true
    bounding_box: {min_y: -90.0, max_y: 90.0, min_x: -180.0, max_x: 180.0}
    filter_point_coords:
    - x: 180
      y: 90
    - x: 0
      y: 0
    - x: 1
      y: 1
- name: Add temporal index to Events
  id: events_events_add_temporal_index
  task: add_temporal_index
  partial:
    df: ${{ workflow.events_filter_events.return }}
    time_col: time
    groupers: ${{ workflow.events_resolved_groupers.return }}
    cast_to_datetime: true
    format: mixed
- name: Add spatial index to Events
  id: events_events_add_spatial_index
  task: add_spatial_index
  partial:
    gdf: ${{ workflow.events_events_add_temporal_index.return }}
    groupers: ${{ workflow.events_resolved_groupers.return }}
- name: Events Colormap
  id: events_events_colormap
  task: apply_color_map
  partial:
    df: ${{ workflow.events_events_add_spatial_index.return }}
    input_column_name: event_type
    colormap: tab20b
    output_column_name: event_type_colormap
- name: Set Events Map Title
  id: events_set_events_map_title
  task: set_string_var
  partial:
    var: Events Map
- name: Split Events by Group
  id: events_split_event_groups
  task: split_groups
  partial:
    df: ${{ workflow.events_events_colormap.return }}
    groupers: ${{ workflow.events_resolved_groupers.return }}
- name: Rename columns for map tooltip display
  id: events_rename_display_columns
  task: map_columns
  partial:
    drop_columns: []
    retain_columns: []
    rename_columns:
      serial_number: Event Serial
      time: Event Time
      event_type_display: Event Type
      reported_by_name: Reported By
    raise_if_not_found: true
    duplicate_strategy: overwrite
  mapvalues:
    argnames: df
    argvalues: ${{ workflow.events_split_event_groups.return }}
- name: Persist events to parquet
  id: events_persist_events_parquet
  task: persist_geoarrow_for_pydeck
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
    - all_geometry_are_none
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename: null
  mapvalues:
    argnames: gdf
    argvalues: ${{ workflow.events_rename_display_columns.return }}
- name: Combine patrol events gdf and data url
  id: event_data_and_url
  skipif:
    conditions:
    - any_keyed_iterables_are_skips
    unpack_depth: 1
  task: groupbykey
  partial:
    iterables:
    - ${{ workflow.events_rename_display_columns.return }}
    - ${{ workflow.events_persist_events_parquet.return }}
- name: Create map layer from grouped Events
  id: events_grouped_events_map_layer
  task: create_geoarrow_scatterplot_layer
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
    - all_geometry_are_none
  partial:
    layer_style:
      get_fill_color: event_type_colormap
      get_radius: 5
    legend:
      label_column: Event Type
      color_column: event_type_colormap
    zoom: false
    tooltip_columns:
    - Event Serial
    - Event Time
    - Event Type
    - Reported By
  mapvalues:
    argnames:
    - geodataframe
    - data_url
    argvalues: ${{ workflow.event_data_and_url.return }}
- name: Draw Ecomap from grouped Events
  id: events_grouped_events_ecomap
  task: draw_map
  partial:
    output_type: json
    title: null
    view_state: null
    tile_layers: ${{ workflow.base_maps.return }}
    legend_style:
      title: Event Type
      format_title: false
      placement: bottom-right
    static: false
    max_zoom: 20
    widget_id: ${{ workflow.events_set_events_map_title.return }}
  mapvalues:
    argnames: geo_layers
    argvalues: ${{ workflow.events_grouped_events_map_layer.return }}
- name: Create grouped Events Map Widget
  id: events_grouped_events_map_widget
  task: create_map_v2_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: ${{ workflow.events_set_events_map_title.return }}
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.events_grouped_events_ecomap.return }}
- name: Merge Events Map Widget Views
  id: event_merged_widget
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.events_grouped_events_map_widget.return }}
- name: Patrols — Data Source
  id: patrol_source
  task: set_er_connection
- name: Patrols — Time Range
  id: patrol_time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'
- id: patrol_types
  task: set_patrols_and_patrol_events_params
  partial:
    client: ${{ workflow.patrol_source.return }}
    time_range: ${{ workflow.patrol_time_range.return }}
    include_patrol_details: true
    raise_on_empty: false
    truncate_to_time_range: true
    sub_page_size: 100
    patrols_overlap_daterange: true
    event_types: []
    event_states: []
    include_null_geometry: true
  name: Patrols — Patrol Types
- name: Patrols — Group Data
  id: patrol_groupers
  task: set_groupers
- name: Extract Timezone Selection
  id: patrols_get_timezone
  task: get_timezone_from_time_range
  partial:
    time_range: ${{ workflow.patrol_time_range.return }}
- id: patrols_prefetch_patrols
  task: get_patrols_from_combined_params
  partial:
    combined_params: ${{ workflow.patrol_types.return }}
- id: patrols_patrol_obs
  task: get_patrol_observations_from_patrols_df_and_combined_params
  partial:
    patrols_df: ${{ workflow.patrols_prefetch_patrols.return }}
    combined_params: ${{ workflow.patrol_types.return }}
- name: Convert patrols to timezone
  id: patrol_local_time
  task: convert_values_to_timezone
  partial:
    df: ${{ workflow.patrols_patrol_obs.return }}
    timezone: ${{ workflow.patrols_get_timezone.return }}
    columns:
    - patrol_start_time
    - patrol_end_time
    - fixtime
- task: extract_spatial_grouper_feature_group_names
  id: patrols_spatial_group_ids
  partial:
    groupers: ${{ workflow.patrol_groupers.return }}
- task: get_spatial_features_group
  id: patrol_spatial_features
  partial:
    client: ${{ workflow.patrol_source.return }}
  map:
    argnames: spatial_features_group_name
    argvalues: ${{ workflow.patrols_spatial_group_ids.return }}
- task: resolve_spatial_feature_groups_for_spatial_groupers
  id: patrols_resolved_groupers
  skipif:
    conditions:
    - never
  partial:
    groupers: ${{ workflow.patrol_groupers.return }}
    spatial_feature_groups: ${{ workflow.patrol_spatial_features.return }}
- name: null
  id: patrol_color_column
  task: set_string_var
  partial:
    var: patrol_type
- id: patrol_color_label
  task: title_case_var
  partial:
    var: ${{ workflow.patrol_color_column.return }}
- name: Transform Observations to Relocations
  id: patrols_patrol_reloc
  task: process_relocations
  partial:
    observations: ${{ workflow.patrol_local_time.return }}
    relocs_columns:
    - patrol_id
    - patrol_start_time
    - patrol_end_time
    - patrol_type__value
    - patrol_type__display
    - patrol_serial_number
    - patrol_status
    - patrol_subject
    - groupby_col
    - fixtime
    - junk_status
    - extra__source
    - geometry
    filter_point_coords:
    - x: 180.0
      y: 90.0
    - x: 0.0
      y: 0.0
    - x: 1.0
      y: 1.0
- name: null
  id: patrols_patrol_traj
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.patrols_patrol_reloc.return }}
    trajectory_segment_filter: null
- name: Add temporal index to Patrol Trajectories
  id: patrols_traj_add_temporal_index
  task: add_temporal_index
  partial:
    df: ${{ workflow.patrols_patrol_traj.return }}
    time_col: extra__patrol_start_time
    groupers: ${{ workflow.patrols_resolved_groupers.return }}
    cast_to_datetime: true
    format: mixed
- name: Add spatial index to Patrol Trajectories
  id: patrols_traj_add_spatial_index
  task: add_spatial_index
  partial:
    gdf: ${{ workflow.patrols_traj_add_temporal_index.return }}
    groupers: ${{ workflow.patrols_resolved_groupers.return }}
- name: Rename value grouper columns for Trajectories
  id: patrol_group_columns
  task: map_columns
  partial:
    df: ${{ workflow.patrols_traj_add_spatial_index.return }}
    drop_columns: []
    retain_columns: []
    rename_columns:
      extra__patrol_type__value: patrol_type
      extra__patrol_serial_number: patrol_serial_number
      extra__patrol_status: patrol_status
      extra__patrol_subject: patrol_subject
    raise_if_not_found: true
    duplicate_strategy: overwrite
- name: Patrol Traj Colormap
  id: patrols_traj_colormap
  task: apply_color_map
  partial:
    df: ${{ workflow.patrol_group_columns.return }}
    colormap:
    - '#FF9600'
    - '#F23B0E'
    - '#A100CB'
    - '#F04564'
    - '#03421A'
    - '#3089FF'
    - '#E26FFF'
    - '#8C1700'
    - '#002960'
    - '#FFD000'
    - '#B62879'
    - '#680078'
    - '#005A56'
    - '#0056C7'
    - '#331878'
    - '#E76826'
    input_column_name: ${{ workflow.patrol_color_column.return }}
    output_column_name: patrol_traj_colormap
- name: Cast Patrol Trajectory Columns
  id: patrol_string_columns
  task: convert_column_values_to_string
  partial:
    df: ${{ workflow.patrols_traj_colormap.return }}
    columns:
    - patrol_serial_number
    - patrol_type
- name: Split Patrol Trajectories by Group
  id: patrols_split_patrol_traj_groups
  task: split_groups
  partial:
    df: ${{ workflow.patrol_string_columns.return }}
    groupers: ${{ workflow.patrols_resolved_groupers.return }}
- name: Set Combined Trajectory & Event Map Title
  id: patrols_set_traj_pe_map_title
  task: set_string_var
  partial:
    var: Patrols Map
- name: Format speed values for display
  id: patrols_speed_val_with_unit
  task: map_values_with_unit
  partial:
    input_column_name: speed_kmhr
    output_column_name: speed_kmhr
    original_unit: km/h
    new_unit: km/h
    decimal_places: 1
  mapvalues:
    argnames: df
    argvalues: ${{ workflow.patrols_split_patrol_traj_groups.return }}
- name: Rename patrol traj columns for map tooltip display
  id: patrol_display_columns
  task: map_columns
  partial:
    drop_columns: []
    retain_columns: []
    rename_columns:
      patrol_serial_number: Patrol Serial Number
      patrol_status: Patrol Status
      patrol_subject: Patrol Subject
      extra__patrol_type__display: Patrol Type
      segment_start: Start
      timespan_seconds: Duration (s)
      speed_kmhr: Speed (kph)
    raise_if_not_found: true
    duplicate_strategy: overwrite
  mapvalues:
    argnames: df
    argvalues: ${{ workflow.patrols_speed_val_with_unit.return }}
- name: Rename patrol status values for display
  id: patrol_display_status
  task: map_values
  partial:
    column_name: Patrol Status
    value_map:
      active: Active
      overdue: Overdue
      done: Done
      cancelled: Cancelled
    missing_values: remove
    replacement: null
  mapvalues:
    argnames: df
    argvalues: ${{ workflow.patrol_display_columns.return }}
- name: Persist patrol traj to parquet
  id: patrols_persist_traj_parquet
  task: persist_geoarrow_for_pydeck
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
    - all_geometry_are_none
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename: null
  mapvalues:
    argnames: gdf
    argvalues: ${{ workflow.patrol_display_status.return }}
- name: Combine patrol traj gdf and data url
  id: patrol_data_and_url
  skipif:
    conditions:
    - any_keyed_iterables_are_skips
    unpack_depth: 1
  task: groupbykey
  partial:
    iterables:
    - ${{ workflow.patrol_display_status.return }}
    - ${{ workflow.patrols_persist_traj_parquet.return }}
- name: Create map layer for each Patrol Trajectories group
  id: patrols_patrol_traj_map_layers
  task: create_geoarrow_path_layer
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
    - all_geometry_are_none
  partial:
    layer_style:
      auto_highlight: false
      opacity: 1.0
      pickable: true
      get_color: patrol_traj_colormap
      get_width: 3.0
      width_units: pixels
      cap_rounded: true
    legend:
      label_column: ${{ workflow.patrol_color_label.return }}
      color_column: patrol_traj_colormap
    zoom: false
    tooltip_columns:
    - Patrol Serial Number
    - Patrol Type
    - Start
    - Duration (s)
    - Speed (kph)
  mapvalues:
    argnames:
    - geodataframe
    - data_url
    argvalues: ${{ workflow.patrol_data_and_url.return }}
- name: Draw Ecomaps for each combined Trajectory and Patrol Events group
  id: patrol_map
  task: draw_map
  partial:
    tile_layers: ${{ workflow.base_maps.return }}
    output_type: json
    legend_style:
      title: ${{ workflow.patrol_color_label.return }}
      format_title: true
      placement: bottom-right
    static: false
    title: null
    view_state: null
    max_zoom: 20
    widget_id: ${{ workflow.patrols_set_traj_pe_map_title.return }}
  mapvalues:
    argnames: geo_layers
    argvalues: ${{ workflow.patrols_patrol_traj_map_layers.return }}
- name: Create Map Widgets for Patrol Events
  id: patrol_widget_views
  task: create_map_v2_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: ${{ workflow.patrols_set_traj_pe_map_title.return }}
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.patrol_map.return }}
- name: Merge EcoMap Widget Views
  id: patrol_merged_widget
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.patrol_widget_views.return }}
- id: events_dashboard
  task: gather_dashboard
  skipif:
    conditions:
    - never
  partial:
    details: ${{ workflow.workflow_details.return }}
    time_range: ${{ workflow.event_time_range.return }}
    groupers: ${{ workflow.events_resolved_groupers.return }}
    widgets:
    - ${{ workflow.event_merged_widget.return }}
- id: patrols_dashboard
  task: gather_dashboard
  skipif:
    conditions:
    - never
  partial:
    details: ${{ workflow.workflow_details.return }}
    time_range: ${{ workflow.patrol_time_range.return }}
    groupers: ${{ workflow.patrols_resolved_groupers.return }}
    widgets:
    - ${{ workflow.patrol_merged_widget.return }}
